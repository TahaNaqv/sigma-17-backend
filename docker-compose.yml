version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sigma17-postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - sigma17-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigma17-web
    restart: always
    command: >
      sh -c "
        python manage.py wait_for_db &&
        python manage.py migrate &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sigma17-network

  redis:
    image: redis:7-alpine
    container_name: sigma17-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - sigma17-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigma17-celery
    restart: always
    command: >
      sh -c "
        python manage.py wait_for_db &&
        celery -A config worker -l info
      "
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sigma17-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigma17-celery-beat
    restart: always
    # Single beat scheduler. Fires periodic tasks defined in config/celery.py
    # (currently: daily 03:15 UTC output-retention sweep). The pidfile and
    # schedule shelf live in /app/celerybeat (mounted via beat_volume) so
    # they survive container restarts.
    command: >
      sh -c "
        python manage.py wait_for_db &&
        mkdir -p /app/celerybeat &&
        celery -A config beat -l info
          --pidfile=/app/celerybeat/celerybeat.pid
          --schedule=/app/celerybeat/celerybeat-schedule
      "
    volumes:
      - .:/app
      - media_volume:/app/media
      - beat_volume:/app/celerybeat
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sigma17-network

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  beat_volume:
    driver: local

networks:
  sigma17-network:
    driver: bridge
